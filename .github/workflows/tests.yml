name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: 运行测试
        run: python -m unittest discover -s tests -v

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: 三种模式出图
        run: |
          pixellogo -c examples/rea.jsonc -m xhs -f png -o out/rea-xhs.png
          pixellogo -c examples/rea.jsonc -m 4:3 -f png -o out/rea-4x3.png
          pixellogo -c examples/og.jsonc -f both -o out/og.png
          pixellogo -c examples/batch.jsonc -f png -o out/batch/
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-samples
          path: out/
