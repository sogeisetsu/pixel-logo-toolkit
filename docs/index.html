<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Gallery · pixellogo</title>
<meta name="description" content="Every image in this gallery is rendered by a single pixellogo command. Copy the command, run it, get the same pixels.">
<meta name="theme-color" content="#F5F4F1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2316130F'/><rect x='3' y='3' width='4' height='4' fill='%23FF2442'/><rect x='9' y='9' width='4' height='4' fill='%23FFF5F7'/></svg>">
<style>
  :root{
    --bg:#F5F4F1;
    --bg-soft:#FBFAF8;
    --card:#FFFFFF;
    --ink:#16130F;
    --ink-2:#4A443C;
    --ink-3:#86807A;
    --line:#E5E1DA;
    --line-strong:#D3CDC3;
    --accent:#FF2442;
    --accent-ink:#FFFFFF;
    --accent-soft:#FFE8EC;
    --shadow-sm:0 1px 2px rgba(22,19,15,.05), 0 2px 8px rgba(22,19,15,.04);
    --shadow-md:0 2px 6px rgba(22,19,15,.06), 0 14px 32px rgba(22,19,15,.10);
    --grid-line:rgba(22,19,15,.028);
    --scrim:rgba(18,16,13,.86);
    --radius:16px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#111110;
    --bg-soft:#171614;
    --card:#1C1A17;
    --ink:#F4F1EA;
    --ink-2:#BDB6AB;
    --ink-3:#9A9285;
    --line:#2B2823;
    --line-strong:#3A352E;
    --accent:#FF4D66;
    --accent-ink:#1A0A0D;
    --accent-soft:#3A1A20;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.28);
    --shadow-md:0 2px 8px rgba(0,0,0,.45), 0 18px 40px rgba(0,0,0,.5);
    --grid-line:rgba(255,255,255,.035);
    --scrim:rgba(8,7,6,.9);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease,color .25s ease;
  }
  img{display:block;max-width:100%;}
  a{color:inherit;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .wrap{width:min(1360px,100% - 48px);margin-inline:auto;}

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:var(--bg);
    background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:saturate(160%) blur(12px);
    -webkit-backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{display:flex;align-items:center;gap:16px;height:60px;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .brand-mark{
    width:22px;height:22px;border-radius:6px;background:var(--ink);
    display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);
    gap:2px;padding:3px;flex:0 0 auto;
  }
  .brand-mark i{border-radius:1px;background:var(--bg);}
  .brand-mark i:nth-child(2){background:var(--accent);}
  .brand-mark i:nth-child(3){background:var(--accent);}
  .brand-text{font-weight:800;letter-spacing:-.01em;font-size:15px;}
  .brand-text small{
    display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
    color:var(--ink-3);font-weight:500;text-transform:uppercase;line-height:1.4;
  }
  .topbar-spacer{flex:1;}

  /* 右上角唯一的控制按钮 + 展开面板 */
  .ctrl{position:relative;}
  .ctrl-btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 12px;border-radius:999px;border:1px solid var(--line-strong);
    background:var(--card);cursor:pointer;font-size:12.5px;font-weight:600;
    transition:border-color .18s,background .18s;
  }
  .ctrl-btn:hover{border-color:var(--ink-3);}
  .ctrl-btn .dot-sep{width:3px;height:3px;border-radius:50%;background:var(--ink-3);}
  .ctrl-btn .glyph{font-size:13px;line-height:1;}
  .ctrl-panel{
    position:absolute;right:0;top:calc(100% + 10px);z-index:50;
    width:264px;padding:14px;border-radius:14px;
    background:var(--card);border:1px solid var(--line);
    box-shadow:var(--shadow-md);
    display:none;
  }
  .ctrl-panel[data-open="true"]{display:block;}
  .ctrl-group + .ctrl-group{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .ctrl-label{
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:7px;
  }
  .segmented{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;
    background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:3px;}
  .segmented button{
    border:0;background:none;cursor:pointer;padding:6px 4px;border-radius:7px;
    font-size:12.5px;font-weight:600;color:var(--ink-3);transition:background .16s,color .16s;
  }
  .segmented button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm);}

  /* ---------- 标题区（只留标题，不放说明文字） ---------- */
  .hero{
    padding:40px 0 22px;
    background:
      repeating-linear-gradient(90deg,var(--grid-line) 0 1px,transparent 1px 32px),
      repeating-linear-gradient(0deg,var(--grid-line) 0 1px,transparent 1px 32px),
      var(--bg-soft);
    border-bottom:1px solid var(--line);
  }
  .hero h1{
    margin:0;font-size:clamp(32px,5.2vw,54px);line-height:1.06;
    letter-spacing:-.025em;font-weight:800;
  }
  .hero h1 .dot{color:var(--accent);}
  .hero-meta{
    display:flex;align-items:center;gap:14px;margin-top:14px;
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3);
    text-transform:uppercase;
  }
  .hero-meta b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums;}

  /* ---------- 筛选 ---------- */
  .filters{position:sticky;top:60px;z-index:30;background:var(--bg);
    background:color-mix(in srgb,var(--bg) 90%,transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .filters-inner{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:11px 0 12px;}
  @media (max-width:760px){
    .filters-inner{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:11px 0;}
  }
  .filters-inner::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
    padding:6px 12px;border-radius:999px;border:1px solid var(--line-strong);
    background:var(--card);cursor:pointer;white-space:nowrap;
    font-size:12.5px;font-weight:600;color:var(--ink-2);
    transition:background .18s,border-color .18s,color .18s;
  }
  .chip:hover{border-color:var(--ink-3);color:var(--ink);}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .chip .n{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:999px;
    background:var(--bg-soft);color:var(--ink-3);border:1px solid var(--line);}
  .chip[aria-pressed="true"] .n{background:transparent;border-color:transparent;color:var(--bg);opacity:.65;}
  .hero-meter{
    margin-left:auto;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.08em;color:var(--ink-3);white-space:nowrap;
  }

  /* ---------- 瀑布流：JS 按固定列数分发，保证每行满列 ---------- */
  .grid-wrap{padding:24px 0 60px;}
  .grid{display:flex;gap:20px;align-items:flex-start;}
  .grid .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:20px;}
  @media (max-width:860px){.grid,.grid .col{gap:14px;}}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow-sm);
    transition:transform .22s cubic-bezier(.32,.72,0,1),box-shadow .22s,border-color .22s;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--line-strong);}
  .card[hidden]{display:none;}

  .card-link{display:block;text-decoration:none;color:inherit;cursor:zoom-in;}
  .thumb{position:relative;aspect-ratio:var(--ar,3/4);background:var(--bg-soft);overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease;}
  .thumb img.is-loaded{opacity:1;}
  .thumb::after{
    content:attr(data-hint);position:absolute;inset:auto 10px 10px auto;
    padding:4px 9px;border-radius:999px;background:rgba(22,19,15,.78);color:#fff;
    font-size:11px;opacity:0;transform:translateY(4px);
    transition:opacity .2s,transform .2s;pointer-events:none;
  }
  .card:hover .thumb::after{opacity:1;transform:translateY(0);}
  .skeleton{
    position:absolute;inset:0;
    background:linear-gradient(100deg,var(--bg-soft) 20%,var(--card) 38%,var(--bg-soft) 56%);
    background-size:220% 100%;animation:shimmer 1.5s linear infinite;
    transition:opacity .35s ease;
  }
  .thumb.is-ready .skeleton{opacity:0;}
  @keyframes shimmer{from{background-position:120% 0;}to{background-position:-40% 0;}}
  .ratio-badge{
    position:absolute;top:9px;left:9px;padding:3px 7px;border-radius:6px;
    background:var(--card);
    background:color-mix(in srgb,var(--card) 88%,transparent);
    font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--ink-2);
    border:1px solid var(--line);
  }

  .card-body{padding:12px 13px 13px;}
  .card-title{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.01em;line-height:1.35;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card-note{
    margin:5px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:2.6em;
  }
  .card-foot{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap;}
  .tag{
    font-family:var(--mono);font-size:10px;color:var(--ink-3);
    border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--bg-soft);
  }
  .copy-btn{
    margin-left:auto;display:inline-flex;align-items:center;gap:5px;
    padding:4px 9px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line-strong);background:var(--card);
    font-size:11.5px;font-weight:600;color:var(--ink-2);
    transition:background .16s,border-color .16s,color .16s;
  }
  .copy-btn:hover{border-color:var(--ink);color:var(--ink);}
  .copy-btn.is-done{border-color:#1F8A5B;color:#1F8A5B;background:color-mix(in srgb,#1F8A5B 10%,transparent);}
  .copy-btn svg{width:12px;height:12px;flex:0 0 auto;}
  @media (max-width:520px){
    .copy-btn .copy-label{display:none;}
    .copy-btn{padding:5px 7px;}
    /* 窄卡片只保留画布与预设，第三个标签让位给复制按钮 */
    .card-foot{gap:6px;}
    .card-foot .tag:nth-of-type(3){display:none;}
    .tag{font-size:9.5px;padding:1px 4px;}
  }

  .reveal{opacity:0;transform:translateY(12px);}
  .reveal.in{opacity:1;transform:none;transition:opacity .45s ease,transform .45s cubic-bezier(.32,.72,0,1);}

  /* ---------- 页脚 ---------- */
  .page-foot{
    border-top:1px solid var(--line);padding:22px 0 54px;
    display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;
    font-size:12.5px;color:var(--ink-3);
  }
  .page-foot a{text-decoration:none;border-bottom:1px solid var(--line-strong);}
  .page-foot a:hover{border-color:var(--ink);color:var(--ink);}
  .page-foot code{font-family:var(--mono);font-size:11px;color:var(--ink-2);}
  .foot-btn{
    padding:5px 11px;border-radius:999px;border:1px solid var(--line-strong);
    background:var(--card);cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-2);
  }
  .foot-btn:hover{border-color:var(--ink);color:var(--ink);}
  .foot-spacer{flex:1;}

  /* ---------- 灯箱 ---------- */
  .lb[hidden]{display:none;}
  .lb{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:26px;}
  .lb-backdrop{position:absolute;inset:0;background:var(--scrim);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .lb-figure{
    position:relative;margin:0;display:grid;grid-template-rows:minmax(0,1fr) auto;
    max-width:min(1180px,100%);max-height:100%;height:min(92vh,900px);
    background:var(--card);border-radius:18px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.45);animation:pop .24s cubic-bezier(.32,.72,0,1);
  }
  @keyframes pop{from{opacity:0;transform:scale(.98);}to{opacity:1;transform:scale(1);}}
  .lb-stage{
    display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);
    place-items:center;overflow:hidden;padding:20px 20px 8px;min-height:0;
    background:
      repeating-conic-gradient(var(--bg-soft) 0 25%,var(--bg) 0 50%) 50%/18px 18px;
  }
  .lb-stage img{max-height:100%;max-width:100%;width:auto;height:auto;border-radius:4px;
    opacity:0;transition:opacity .28s ease;}
  .lb-stage img.is-loaded{opacity:1;}
  .lb-caption{
    display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:start;
    padding:14px 18px 16px;border-top:1px solid var(--line);background:var(--card);
  }
  .lb-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .lb-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;}
  .lb-note{margin:4px 0 0;font-size:12.5px;color:var(--ink-3);}
  .lb-meta{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 0;}
  .lb-side{display:grid;gap:8px;justify-items:end;align-content:start;
    font-family:var(--mono);font-size:11px;color:var(--ink-3);}
  .lb-actions{display:flex;gap:6px;align-items:center;}
  .lb-cmd{
    grid-column:1/-1;margin:10px 0 0;padding:9px 11px;border-radius:8px;
    background:var(--bg-soft);border:1px solid var(--line);
    font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--ink-2);
    overflow-x:auto;white-space:pre;
  }
  .lb-close,.lb-nav{
    position:absolute;z-index:2;border:1px solid rgba(255,255,255,.24);
    background:rgba(22,19,15,.62);color:#fff;cursor:pointer;
    display:grid;place-items:center;border-radius:50%;
    transition:background .18s,transform .18s;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .lb-close:hover,.lb-nav:hover{background:rgba(22,19,15,.88);}
  .lb-close:focus-visible,.lb-nav:focus-visible{outline:2px solid #fff;outline-offset:3px;}
  .lb-close{top:18px;right:18px;width:38px;height:38px;font-size:19px;line-height:1;}
  .lb-nav{top:50%;transform:translateY(-50%);width:44px;height:44px;font-size:22px;line-height:1;}
  .lb-nav:hover{transform:translateY(-50%) scale(1.05);}
  .lb-prev{left:16px;}
  .lb-next{right:16px;}
  .lb-btn{
    display:inline-flex;align-items:center;gap:5px;text-decoration:none;
    padding:6px 11px;border-radius:999px;border:1px solid var(--line-strong);
    background:var(--card);font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .lb-btn:hover{border-color:var(--ink);}

  /* ---------- 更新记录弹窗 ---------- */
  .modal[hidden]{display:none;}
  .modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;}
  .modal-backdrop{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease;}
  .modal-card{
    position:relative;width:min(620px,100%);max-height:min(80vh,760px);overflow:auto;
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;
    box-shadow:0 30px 80px rgba(0,0,0,.45);animation:pop .22s cubic-bezier(.32,.72,0,1);
  }
  .modal-card h2{margin:0 0 4px;font-size:19px;letter-spacing:-.01em;}
  .modal-sub{margin:0 0 18px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
  .timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:1px solid var(--line);}
  .timeline li{position:relative;padding:0 0 18px 14px;}
  .timeline li:last-child{padding-bottom:0;}
  .timeline li::before{
    content:"";position:absolute;left:-23px;top:6px;width:9px;height:9px;border-radius:2px;
    background:var(--accent);box-shadow:0 0 0 3px var(--card);
  }
  .timeline time{display:block;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.08em;color:var(--ink-3);margin-bottom:3px;}
  .timeline p{margin:0;font-size:13.5px;color:var(--ink-2);}
  .modal-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;
    border:1px solid var(--line);background:var(--bg-soft);cursor:pointer;font-size:15px;line-height:1;}

  /* ---------- 提示条 ---------- */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:100;
    padding:9px 16px;border-radius:999px;background:var(--ink);color:var(--bg);
    font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;
    transition:opacity .22s ease,transform .22s ease;box-shadow:var(--shadow-md);
  }
  .toast.is-on{opacity:1;transform:translate(-50%,0);}

  .empty{padding:70px 0;text-align:center;color:var(--ink-3);
    font-family:var(--mono);font-size:12px;line-height:1.9;}
  .empty code{background:var(--bg-soft);border:1px solid var(--line);border-radius:5px;padding:2px 6px;}

  @media (max-width:720px){
    .wrap{width:calc(100% - 28px);}
    .hero{padding:26px 0 16px;}
    .filters{top:56px;}
    .topbar-inner{height:56px;}
    .lb{padding:0;}
    .lb-figure{border-radius:0;height:100%;width:100%;max-width:none;}
    .lb-stage{padding:54px 10px 4px;}
    .lb-caption{grid-template-columns:1fr;padding:12px 14px 18px;}
    .lb-side{justify-items:start;grid-auto-flow:column;align-items:center;}
    .lb-nav{top:32%;width:38px;height:38px;}
    .lb-prev{left:8px;} .lb-next{right:8px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
    .reveal{opacity:1;transform:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="./" aria-label="pixellogo">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-text">pixellogo<small>Pixel Gallery</small></span>
    </a>
    <div class="topbar-spacer"></div>

    <!-- 右上角唯一的控制按钮：点开后同时管语言与明暗 -->
    <div class="ctrl">
      <button class="ctrl-btn" id="ctrlBtn" type="button" aria-expanded="false" aria-controls="ctrlPanel">
        <span class="glyph" id="ctrlGlyph" aria-hidden="true">◐</span>
        <span id="ctrlLang">EN</span>
        <span class="dot-sep" aria-hidden="true"></span>
        <span id="ctrlTheme">Auto</span>
      </button>
      <div class="ctrl-panel" id="ctrlPanel" role="group" aria-label="Display settings">
        <div class="ctrl-group">
          <div class="ctrl-label" id="lblLang">Language</div>
          <div class="segmented" role="group" aria-labelledby="lblLang">
            <button type="button" data-lang="en" aria-pressed="true">English</button>
            <button type="button" data-lang="zh" aria-pressed="false">中文</button>
          </div>
        </div>
        <div class="ctrl-group">
          <div class="ctrl-label" id="lblTheme">Theme</div>
          <div class="segmented" role="group" aria-labelledby="lblTheme">
            <button type="button" data-theme-opt="auto" aria-pressed="true">Auto</button>
            <button type="button" data-theme-opt="light" aria-pressed="false">Light</button>
            <button type="button" data-theme-opt="dark" aria-pressed="false">Dark</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1 id="pageTitle">Pixel Gallery<span class="dot">.</span></h1>
    <div class="hero-meta">
      <span><b id="statCount">0</b> <span id="statCountLabel">pieces</span></span>
      <span><b>5</b> <span id="statCanvasLabel">canvases</span></span>
      <span><b>10</b> <span id="statPresetLabel">presets</span></span>
      <span class="hero-meter" id="meter">0 / 0</span>

  </div>
</section>

<main class="wrap grid-wrap">

  <footer class="page-foot">

<!-- 灯箱预览 -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-labelledby="lbTitle" hidden>
  <div class="lb-backdrop" data-close></div>
  <button class="lb-close" type="button" data-close aria-label="Close">×</button>
  <button class="lb-nav lb-prev" type="button" id="lbPrev" aria-label="Previous">‹</button>
  <button class="lb-nav lb-next" type="button" id="lbNext" aria-label="Next">›</button>
  <figure class="lb-figure">
    <div class="lb-stage"><img id="lbImg" alt=""></div>
    <figcaption class="lb-caption">
      <div>
        <div class="lb-head"><h2 id="lbTitle"></h2><span id="lbIndex" class="tag"></span></div>

          <a class="lb-btn" id="lbDownload" href="#" download>PNG ↓</a>

<!-- 更新记录 -->
<div class="modal" id="changelog" role="dialog" aria-modal="true" aria-labelledby="clTitle" hidden>
  <div class="modal-backdrop" data-cl-close></div>

    <button class="modal-close" type="button" data-cl-close aria-label="Close">×</button>
    <h2 id="clTitle">Changelog</h2>
    <p class="modal-sub" id="clSub"></p>
    <ul class="timeline" id="timeline"></ul>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="gallery-data.js"></script>
<script>
(function () {
  "use strict";

  var DATA = window.GALLERY_DATA;
  var doc = document.documentElement;

  /* ---------------- 文案 ---------------- */
  var I18N = {
    en: {
      title: "Pixel Gallery",
      pieces: "pieces", canvases: "canvases", presets: "presets",
      all: "All", copy: "Copy", copyDone: "Copied", copyFail: "Copy failed",
      copyCommand: "Copy command", copied: "Command copied — paste it in your terminal",
      copiedShort: "Copied",
      preview: "Preview", lang: "Language", theme: "Theme",
      auto: "Auto", light: "Light", dark: "Dark",
      settings: "Display settings", close: "Close", prev: "Previous", next: "Next",
      download: "Download PNG", changelog: "Changelog", updated: "Updated",
      source: 'Data compiled from <a href="gallery.md">docs/gallery.md</a>',
      empty: 'No gallery data found.<br>Run <code>python tools/gallery_site.py</code> first.',
      themeWord: "Auto"
    },
    zh: {
      title: "像素画廊",
      pieces: "张图", canvases: "种画布", presets: "套预设",
      all: "全部", copy: "复制", copyDone: "已复制", copyFail: "复制失败",
      copyCommand: "复制命令", copied: "命令已复制，粘贴到终端即可生成同一张图",
      copiedShort: "已复制",
      preview: "预览", lang: "语言", theme: "外观",
      auto: "自动", light: "浅色", dark: "深色",
      settings: "显示设置", close: "关闭", prev: "上一张", next: "下一张",
      download: "下载 PNG", changelog: "更新记录", updated: "更新于",
      source: '数据由 <a href="gallery.md">docs/gallery.md</a> 编译生成',
      empty: '没有找到画廊数据。<br>请先运行 <code>python tools/gallery_site.py</code>。',
      themeWord: "自动"
    }
  };

  var state = {
    lang: "en",
    theme: "auto",
    section: "all",
    visible: [],
    pos: 0
  };

  function t(key) {
    return (I18N[state.lang] || I18N.en)[key] || key;
  }

  /* ---------------- 偏好：语言默认英文，主题默认 auto ---------------- */
  function readPref(key, fallback) {
    try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
  }
  function writePref(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  var savedLang = readPref("pg.lang", "en");
  var savedTheme = readPref("pg.theme", "auto");
  state.lang = savedLang === "zh" ? "zh" : "en";
  state.theme = ["light", "dark", "auto"].indexOf(savedTheme) >= 0 ? savedTheme : "auto";

  var systemDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  function effectiveTheme() {
    if (state.theme === "auto") return systemDark && systemDark.matches ? "dark" : "light";
    return state.theme;
  }

  function applyTheme() {
    var mode = effectiveTheme();
    doc.setAttribute("data-theme", mode);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", mode === "dark" ? "#111110" : "#F5F4F1");
    Array.prototype.forEach.call(document.querySelectorAll("[data-theme-opt]"), function (btn) {
      btn.setAttribute("aria-pressed", btn.dataset.themeOpt === state.theme ? "true" : "false");
    });
    var label = state.theme === "auto" ? t("auto") : (state.theme === "dark" ? t("dark") : t("light"));
    document.getElementById("ctrlTheme").textContent = label;
    document.getElementById("ctrlGlyph").textContent = mode === "dark" ? "☾" : "☀";
  }

  function applyLang() {
    doc.setAttribute("lang", state.lang === "zh" ? "zh-CN" : "en");
    doc.setAttribute("data-locale", state.lang);
    document.title = t("title") + " · pixellogo";
    document.getElementById("pageTitle").textContent = t("title");
    document.getElementById("pageTitle").appendChild(makeDot());
    document.getElementById("statCountLabel").textContent = t("pieces");
    document.getElementById("statCanvasLabel").textContent = t("canvases");
    document.getElementById("statPresetLabel").textContent = t("presets");
    document.getElementById("ctrlLang").textContent = state.lang === "zh" ? "中文" : "EN";
    document.getElementById("ctrlPanel").setAttribute("aria-label", t("settings"));
    document.getElementById("lblLang").textContent = t("lang");
    document.getElementById("lblTheme").textContent = t("theme");
    var themeOpts = document.querySelectorAll("[data-theme-opt]");
    themeOpts[0].textContent = t("auto");
    themeOpts[1].textContent = t("light");
    themeOpts[2].textContent = t("dark");
    document.getElementById("lbPrev").setAttribute("aria-label", t("prev"));
    document.getElementById("lbNext").setAttribute("aria-label", t("next"));
    document.querySelector(".lb-close").setAttribute("aria-label", t("close"));
    document.querySelector(".modal-close").setAttribute("aria-label", t("close"));
    document.getElementById("changelogBtn").textContent = t("changelog");
    document.getElementById("lbCopy").textContent = t("copy");
    document.getElementById("lbDownload").textContent = t("download") + " ↓";
    document.getElementById("lbDownload").setAttribute("aria-label", t("download"));
    document.getElementById("footSource").innerHTML =
      t("source") + (DATA ? ' · <span style="font-family:var(--mono);font-size:11px">'
        + t("updated") + " " + DATA.generated + "</span>" : "");
    document.getElementById("clTitle").textContent = t("changelog");
    document.getElementById("clSub").textContent = DATA ? (t("updated") + " " + DATA.generated) : "";
    Array.prototype.forEach.call(ctrlPanel.querySelectorAll("[data-lang]"), function (btn) {
      btn.setAttribute("aria-pressed", btn.dataset.lang === state.lang ? "true" : "false");
    });
    renderChips();
    renderCardCopyLabels();
    renderTimeline();
    if (!document.getElementById("lb").hidden) showAt(state.pos);
    applyTheme();
  }

  function makeDot() {
    var span = document.createElement("span");
    span.className = "dot";
    span.textContent = ".";
    return span;
  }

  /* ---------------- 卡片 ---------------- */
  var grid = document.getElementById("grid");
  var chipsBox = document.getElementById("chips");
  var cards = [];          // 全部卡片，按数据顺序
  var bySection = {};      // 分组 -> 卡片索引
  var loaded = {};         // 已加载的图片
  var cols = [];

  function itemSection(sec) { return sec.key; }

  function buildCards() {
    var index = 0;
    DATA.sections.forEach(function (sec) {
      bySection[sec.key] = [];
      sec.items.forEach(function (item) {
        // 闭包里必须锁住当前下标：var 会被后续迭代改写
        var cardIndex = index;
        var card = document.createElement("article");
        card.className = "card reveal";
        card.dataset.section = itemSection(sec);
        card.dataset.index = String(cardIndex);

        var link = document.createElement("a");
        link.className = "card-link";
        link.href = item.image;
        link.setAttribute("aria-label", t("preview") + ": " + item.title);

        var thumb = document.createElement("div");
        thumb.className = "thumb";
        thumb.style.setProperty("--ar", item.width + "/" + item.height);
        thumb.setAttribute("data-hint", t("preview"));

        var skel = document.createElement("div");
        skel.className = "skeleton";
        thumb.appendChild(skel);

        var img = document.createElement("img");
        img.src = item.image;
        img.alt = item.title + (item.noteEn ? " — " + item.noteEn : "");
        img.loading = "lazy";
        img.decoding = "async";
        img.width = item.width;
        img.height = item.height;
        img.addEventListener("load", function () {
          img.classList.add("is-loaded");
          thumb.classList.add("is-ready");
          loaded[cardIndex] = true;
          updateMeter();
        }, { once: true });
        img.addEventListener("error", function () {
          thumb.classList.add("is-ready");
          img.remove();
          var miss = document.createElement("div");
          miss.className = "skeleton";
          miss.style.animation = "none";
          miss.textContent = "404";
          miss.style.display = "grid";
          miss.style.placeItems = "center";
          miss.style.color = "var(--ink-3)";
          miss.style.font = "12px var(--mono)";
          thumb.appendChild(miss);
          loaded[cardIndex] = true;
          updateMeter();
        }, { once: true });
        thumb.appendChild(img);

        var ratio = document.createElement("span");
        ratio.className = "ratio-badge";
        ratio.textContent = ratioText(item.width, item.height);
        thumb.appendChild(ratio);

        link.appendChild(thumb);
        link.addEventListener("click", function (event) {
          event.preventDefault();
          openLightbox(cardIndex);
        });

        var body = document.createElement("div");
        body.className = "card-body";
        var h3 = document.createElement("h3");
        h3.className = "card-title";
        h3.textContent = item.title;
        var note = document.createElement("p");
        note.className = "card-note";
        body.appendChild(h3);
        body.appendChild(note);

        var foot = document.createElement("div");
        foot.className = "card-foot";
        [item.canvas, item.preset, item.pattern === "none" ? "" : item.pattern].forEach(function (tag) {
          if (!tag) return;
          var span = document.createElement("span");
          span.className = "tag";
          span.textContent = tag;
          foot.appendChild(span);
        });

        var copy = document.createElement("button");
        copy.type = "button";
        copy.className = "copy-btn";
        copy.innerHTML = copyIcon() + '<span class="copy-label"></span>';
        copy.setAttribute("aria-label", t("copyCommand"));
        copy.addEventListener("click", function (event) {
          event.stopPropagation();
          event.preventDefault();
          copyCommand(item, copy);
        });
        foot.appendChild(copy);

        body.appendChild(foot);
        card.appendChild(link);
        card.appendChild(body);

        card._item = item;
        card._sec = sec;
        cards.push(card);
        bySection[sec.key].push(cardIndex);
        index += 1;
      });
    });
    document.getElementById("statCount").textContent = String(cards.length);
  }

  function copyIcon() {
    return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">'
      + '<rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-1a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h1"/></svg>';
  }

  function renderCardCopyLabels() {
    cards.forEach(function (card) {
      var item = card._item;
      card.querySelector(".card-note").textContent =
        state.lang === "zh" ? item.noteZh : item.noteEn;
      card.querySelector(".thumb").setAttribute("data-hint", t("preview"));
      card.querySelector(".copy-label").textContent = t("copy");
      card.querySelector(".copy-btn").setAttribute("aria-label", t("copyCommand"));
      var link = card.querySelector(".card-link");
      link.setAttribute("aria-label", t("preview") + ": " + item.title);
    });
  }

  function ratioText(w, h) {
    function gcd(a, b) { return b ? gcd(b, a % b) : a; }
    var d = gcd(w, h) || 1;
    return (w / d) + ":" + (h / d);
  }

  /* ---------------- 分组按钮 ---------------- */
  function renderChips() {
    var html = '<button class="chip" data-section="all" aria-pressed="'
      + (state.section === "all" ? "true" : "false") + '">' + t("all")
      + ' <span class="n">' + cards.length + "</span></button>";
    DATA.sections.forEach(function (sec) {
      html += '<button class="chip" data-section="' + sec.key + '" aria-pressed="'
        + (state.section === sec.key ? "true" : "false") + '">'
        + (state.lang === "zh" ? sec.zh : sec.en)
        + ' <span class="n">' + sec.items.length + "</span></button>";
    });
    chipsBox.innerHTML = html;
  }

  /* ---------------- 列分发：固定列数，保证每行满列 ---------------- */
  function columnCount() {
    var w = grid.clientWidth || window.innerWidth;
    if (w >= 1120) return 4;
    if (w >= 800) return 3;
    if (w >= 340) return 2;
    return 1;
  }

  function ensureCols(count) {
    if (cols.length === count) return;
    grid.innerHTML = "";
    cols = [];
    for (var i = 0; i < count; i++) {
      var col = document.createElement("div");
      col.className = "col";
      grid.appendChild(col);
      cols.push(col);
    }
  }

  function layout() {
    var count = columnCount();
    ensureCols(count);
    var list = state.visible;
    cols.forEach(function (col) { col.innerHTML = ""; });
    list.forEach(function (index, order) {
      // 轮转分发：第一行的 N 张严格落在 N 列里，阅读顺序与数据顺序一致
      cols[order % count].appendChild(cards[index]);
    });
    observeReveal();
  }

  function updateMeter() {
    var total = state.visible.length;
    var done = 0;
    state.visible.forEach(function (index) { if (loaded[index]) done += 1; });
    var el = document.getElementById("meter");
    el.textContent = done + " / " + total;
  }

  /* ---------------- 筛选 ---------------- */
  function applySection(key) {
    state.section = key;
    state.visible = [];
    cards.forEach(function (card, index) {
      var show = key === "all" || card.dataset.section === key;
      card.hidden = !show;
      if (show) state.visible.push(index);
    });
    renderChips();
    layout();
    updateMeter();
    document.getElementById("empty").hidden = state.visible.length > 0;
    if (history.replaceState) {
      var hash = key === "all" ? location.pathname : "#" + key;
      history.replaceState(null, "", hash);
    }
  }

  chipsBox.addEventListener("click", function (event) {
    var chip = event.target.closest(".chip");
    if (!chip) return;
    applySection(chip.dataset.section);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  /* ---------------- 入场动画 ---------------- */
  var revealObserver = null;
  function observeReveal() {
    var nodes = grid.querySelectorAll(".reveal:not(.in)");
    if (!("IntersectionObserver" in window)) {
      Array.prototype.forEach.call(nodes, function (n) { n.classList.add("in"); });
      return;
    }
    if (!revealObserver) {
      revealObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var node = entry.target;
          var delay = Math.min(Number(node.dataset.index || 0) % 12, 8) * 22;
          setTimeout(function () { node.classList.add("in"); }, delay);
          revealObserver.unobserve(node);
        });
      }, { rootMargin: "140px 0px" });
    }
    Array.prototype.forEach.call(nodes, function (n) { revealObserver.observe(n); });
  }

  /* ---------------- 复制命令 ---------------- */
  var toastTimer = null;
  function toast(message) {
    var el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("is-on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("is-on"); }, 2200);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; })
        .catch(function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.top = "-1000px";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(area);
    return ok;
  }

  function copyCommand(item, button) {
    copyText(item.command).then(function (ok) {
      if (!ok) { toast(t("copyFail")); return; }
      toast(t("copied"));
      if (!button) return;
      var label = button.querySelector(".copy-label");
      var original = label ? label.textContent : button.textContent;
      button.classList.add("is-done");
      if (label) label.textContent = t("copyDone");
      else button.textContent = t("copyDone");
      setTimeout(function () {
        button.classList.remove("is-done");
        if (label) label.textContent = t("copy");
        else button.textContent = original;
      }, 1600);
    });
  }

  /* ---------------- 灯箱 ---------------- */
  var lb = document.getElementById("lb");
  var lbImg = document.getElementById("lbImg");
  var lbTitle = document.getElementById("lbTitle");
  var lbNote = document.getElementById("lbNote");
  var lbMeta = document.getElementById("lbMeta");
  var lbIndex = document.getElementById("lbIndex");
  var lbCmd = document.getElementById("lbCmd");
  var lbCopy = document.getElementById("lbCopy");
  var lbDownload = document.getElementById("lbDownload");
  var lastFocus = null;

  function currentItem() { return cards[state.visible[state.pos]]._item; }

  function showAt(pos) {
    if (!state.visible.length) return;
    var total = state.visible.length;
    state.pos = (pos + total) % total;
    var card = cards[state.visible[state.pos]];
    var item = card._item;

    lbImg.classList.remove("is-loaded");
    lbImg.src = item.image;
    lbImg.alt = item.title;
    if (lbImg.complete) lbImg.classList.add("is-loaded");
    else lbImg.onload = function () { lbImg.classList.add("is-loaded"); };

    lbTitle.textContent = item.title;
    lbNote.textContent = state.lang === "zh" ? item.noteZh : item.noteEn;
    lbIndex.textContent = (state.pos + 1) + " / " + total;
    lbMeta.innerHTML = "";
    [item.canvas, item.width + "×" + item.height, item.preset,
     item.pattern === "none" ? "" : item.pattern, item.divider ? "divider " + item.divider : ""]
      .forEach(function (text) {
        if (!text) return;
        var span = document.createElement("span");
        span.className = "tag";
        span.textContent = text;
        lbMeta.appendChild(span);
      });

    lbCmd.textContent = item.command;
    lbDownload.href = item.image;
    lbDownload.setAttribute("download", item.image.split("/").pop());
    preload(state.pos + 1);
    preload(state.pos - 1);
  }

  function preload(pos) {
    var total = state.visible.length;
    if (!total) return;
    var index = state.visible[(pos + total) % total];
    var im = new Image();
    im.src = cards[index]._item.image;
  }

  function openLightbox(index) {
    lastFocus = document.activeElement;
    var pos = state.visible.indexOf(index);
    lb.hidden = false;
    document.body.style.overflow = "hidden";
    showAt(pos < 0 ? 0 : pos);
    document.querySelector(".lb-close").focus();
  }

  function closeLightbox() {
    lb.hidden = true;
    document.body.style.overflow = "";
    lbImg.removeAttribute("src");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  document.getElementById("lbPrev").addEventListener("click", function () { showAt(state.pos - 1); });
  document.getElementById("lbNext").addEventListener("click", function () { showAt(state.pos + 1); });
  lbCopy.addEventListener("click", function () { copyCommand(currentItem(), null); });
  Array.prototype.forEach.call(lb.querySelectorAll("[data-close]"), function (node) {
    node.addEventListener("click", closeLightbox);
  });

  /* ---------------- 更新记录 ---------------- */
  var modal = document.getElementById("changelog");
  function renderTimeline() {
    var list = document.getElementById("timeline");
    list.innerHTML = "";
    (DATA.timeline || []).forEach(function (entry) {
      var li = document.createElement("li");
      var time = document.createElement("time");
      time.dateTime = entry.date;
      time.textContent = entry.date;
      var p = document.createElement("p");
      p.textContent = state.lang === "zh" ? entry.zh : entry.en;
      li.appendChild(time);
      li.appendChild(p);
      list.appendChild(li);
    });
  }
  document.getElementById("changelogBtn").addEventListener("click", function () {
    modal.hidden = false;
    document.body.style.overflow = "hidden";
    document.querySelector(".modal-close").focus();
  });
  function closeModal() {
    modal.hidden = true;
    if (lb.hidden) document.body.style.overflow = "";
  }
  Array.prototype.forEach.call(modal.querySelectorAll("[data-cl-close]"), function (node) {
    node.addEventListener("click", closeModal);
  });

  /* ---------------- 设置面板 ---------------- */
  var ctrlBtn = document.getElementById("ctrlBtn");
  var ctrlPanel = document.getElementById("ctrlPanel");
  function setCtrl(open) {
    ctrlPanel.dataset.open = open ? "true" : "false";
    ctrlBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  ctrlBtn.addEventListener("click", function (event) {
    event.stopPropagation();
    setCtrl(ctrlPanel.dataset.open !== "true");
  });
  document.addEventListener("click", function (event) {
    if (!ctrlPanel.contains(event.target) && event.target !== ctrlBtn) setCtrl(false);
  });
  ctrlPanel.addEventListener("click", function (event) {
    var langBtn = event.target.closest("[data-lang]");
    if (langBtn) {
      state.lang = langBtn.dataset.lang === "zh" ? "zh" : "en";
      writePref("pg.lang", state.lang);
      applyLang();
      return;
    }
    var themeBtn = event.target.closest("[data-theme-opt]");
    if (themeBtn) {
      state.theme = themeBtn.dataset.themeOpt;
      writePref("pg.theme", state.theme);
      applyTheme();
    }
  });

  /* ---------------- 全局键盘 ---------------- */
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      if (!modal.hidden) { closeModal(); return; }
      if (!lb.hidden) { closeLightbox(); return; }
      setCtrl(false);
      return;
    }
    if (!lb.hidden) {
      if (event.key === "ArrowLeft") { event.preventDefault(); showAt(state.pos - 1); }
      else if (event.key === "ArrowRight") { event.preventDefault(); showAt(state.pos + 1); }
      else if (event.key === "Tab") {
        var focusables = lb.querySelectorAll("button, a[href]");
        if (!focusables.length) return;
        var first = focusables[0];
        var last = focusables[focusables.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault(); last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault(); first.focus();
        }
      }
    }
  });

  /* ---------------- 响应式 ---------------- */
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (columnCount() !== cols.length) layout();
    }, 120);
  });

  if (systemDark) {
    var onSystemChange = function () { if (state.theme === "auto") applyTheme(); };
    if (systemDark.addEventListener) systemDark.addEventListener("change", onSystemChange);
    else if (systemDark.addListener) systemDark.addListener(onSystemChange);
  }

  /* ---------------- 启动 ---------------- */
  if (!DATA || !DATA.sections || !DATA.sections.length) {
    document.getElementById("empty").hidden = false;
    document.getElementById("empty").innerHTML = I18N[state.lang].empty;
    document.getElementById("statCount").textContent = "0";
    return;
  }

  buildCards();

  var initial = location.hash.replace("#", "");
  var known = initial === "all" || DATA.sections.some(function (s) { return s.key === initial; });
  state.section = known ? initial : "all";

  applyLang();
  applySection(state.section);
  applyTheme();
})();
</script>
</body>
</html>
